apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minioth
  labels:
    app: minioth
  namespace: kuspace
spec:
  selector:
    matchLabels:
      app: minioth
  serviceName: minioth
  replicas: 1
  template:
    metadata:
      labels:
        app: minioth
    spec:
      containers:
      - name: minioth
        image: kyri56xcaesar/kuspace:minioth-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: web
        volumeMounts: # volume mount linked to a pv for database and perstent storage
        - name: database
          mountPath: /data
        - name: config # volume mount used for configuration
          mountPath: /app/minioth.env
          subPath: minioth.conf
        env: # environment variables used only for secrets
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY
        - name: JWT_REFRESH_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-refresh-secret
              key: JWT_REFRESH_SECRET_KEY
        - name: SERVICE_SECRETS
          valueFrom:
            secretKeyRef:
              name: minioth-service-secrets
              key: MINIOTH_SERVICE_SECRETS
        - name: ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minioth-secret
              key: MINIOTH_SECRET_KEY
      volumes:
      - name: config
        configMap:
          name: minioth-config
      - name: database
        persistentVolumeClaim:
          claimName: minioth-pvc
      #nodeSelector:
        #kubernetes.io/hostname: docker-desktop
        #kubernetes.io/hostname: minikube
