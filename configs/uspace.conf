#
## The uspace Service configuration
#
IP=0.0.0.0
VERBOSE=true
NAMESPACE=kuspace
STORAGE_SYSTEM=minio

# kubernetes configuration
API_GIN_MODE=release 
PROFILE=container

# baremetal configuration
# API_GIN_MODE=debug
# PROFILE=baremetal

J_WS_ADDRESS=wss:8082 
# J_WS_ADDRESS=localhost:30082
J_WS_LOGS_PATH=data/logs/jobs/

#local
# database users/volumes: uspace's embedded fslite (metadata only; uspace
# names the file fsl_local.db). These were spelled DB_FSL_* and ignored.
FSL_DB_PATH=data/db/fslite
FSL_DB_DRIVER=sqlite3
FSL_DB_MAX_OPEN_CONNS=50
FSL_DB_MAX_IDLE_CONNS=10
FSL_DB_MAX_LIFETIME=10
LOCAL_VOLUMES_DEFAULT_PATH=data/volumes
LOCAL_VOLUMES_DEFAULT_CAPACITY=-1
FSL_SERVER=false
FSL_LOCALITY=false

#minio
MINIO_ENDPOINT=minio:9000
MINIO_NODEPORT_ENDPOINT=localhost:30101
MINIO_ACCESS_KEY=minioadmin
# Secrets (JWT keys, service secret, passwords) live in configs/secrets.env
# (gitignored, see configs/secrets.env.example) and are injected as env vars.
# MINIO_ENDPOINT=minio:9000
MINIO_USE_SSL=false
MINIO_OBJECT_LOCKING=false
MINIO_DEFAULT_BUCKET=uspace-default
OBJECT_SHARED=true
OBJECT_SHARE_EXPIRE=1440
ONLY_PRESIGNED_UPLOAD=true
OBJECT_SIZE_THRESHOLD=400000000

# jobs 
J_DISPATCHER=scheduler
J_QUEUE_SIZE=100 
# just for the default sched
J_MAX_WORKERS=50 
# just fo rhte default sched

# execution
J_EXECUTOR=kubernetes
#J_EXECUTOR=docker
J_MAX_CPU=1
J_MAX_MEM=33000 
# Mi
J_MAX_STORAGE=4
J_MAX_PARALLELISM=4
J_MAX_TIMEOUT=10
J_MAX_LOGIC_CHARS=1000000
J_TTL=300

# database jobs
DB_JOBS=jobs.db
DB_JOBS_PATH=data/db/uspace
DB_JOBS_DRIVER=sqlite3
DB_JOBS_MAX_OPEN_CONNS=50
DB_JOBS_MAX_IDLE_CONNS=10
DB_JOBS_MAX_LIFETIME=10

# networks

API_PORT=8079
API_ADDRESS=uspace
API_LOGS_PATH=data/logs/uspace/
API_LOGS_MAX_FETCH=100

FRONT_PORT=8080
FRONT_ADDRESS=frontapp

AUTH_PORT=9090
AUTH_ADDRESS=minioth

ALLOWED_ORIGINS=*
ALLOWED_HEADERS=*
ALLOWED_METHODS=*

JWT_VALIDITY_HOURS=1
# how uspace verifies minioth access tokens; must match minioth's JWT_SIGNING_ALG:
# HS256 (the shared JWT_SECRET_KEY) or RS256 (minioth's public keys, from its JWKS)
JWT_SIGNING_ALG=HS256

MINIOTH_ACCESS_KEY=kuspaceadmin

