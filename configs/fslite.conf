#local
# database users/volumes
# (these were spelled DB_FSL_* and ignored; the values are the ones in effect)
FSL_DB=database.db
FSL_DB_PATH=data/db/fslite
FSL_DB_MAX_OPEN_CONNS=50
FSL_DB_MAX_IDLE_CONNS=10
FSL_DB_MAX_LIFETIME=10
LOCAL_VOLUMES_DEFAULT_PATH=data/volumes/fslite
LOCAL_VOLUMES_DEFAULT_CAPACITY=5

FSL_SERVER=true
FSL_LOCALITY=true
FSL_DB_DRIVER=sqlite3
FSL_ACCESS_KEY=fsladmin
# Secrets (JWT keys, service secret, passwords) live in configs/secrets.env
# (gitignored, see configs/secrets.env.example) and are injected as env vars.
FSL_UNLOCKED=true
# networks
#IP=0.0.0.0
IP=localhost

API_PORT=7070
API_LOGS_PATH=data/logs/fslite/
API_LOGS_MAX_FETCH=100
API_GIN_MODE=debug

ALLOWED_ORIGINS=*
ALLOWED_HEADERS=*
ALLOWED_METHODS=*

