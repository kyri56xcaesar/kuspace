#
## Minioth Service configuration file
## (third_party/minioth v1.0.0 - external repo, see configs source comment below)
#
# This file only carries NON-secret settings: it is baked into the minioth
# ConfigMap and mounted read-only into the container at /app/minioth.env.
# Secret-shaped values (JWT_SECRET_KEY, JWT_REFRESH_KEY, SERVICE_SECRETS,
# ROOT_PASSWORD) are injected separately as container env vars from Kubernetes
# Secrets (see deployments/kubernetes/stateful-sets/minioth-stateful-set.yaml
# and configs/uspace.conf, the canonical secret source kuspacectl reads from) -
# godotenv does not override already-set env vars, so the Secret-injected
# values win over anything (blank) left for them here.
#
IP=0.0.0.0
GIN_MODE=release
# or debug, for local development

API_PORT=9090

# The one privileged account minioth seeds on first boot. Password comes from
# the Secret-injected ROOT_PASSWORD env var, not this file.
ROOT_USERNAME=kuspaceadmin

ALLOWED_ORIGINS=*
ALLOWED_HEADERS=Origin,Content-Type,Authorization,Access-Control-Allow-Origin
ALLOWED_METHODS=GET,POST,DELETE,PUT,OPTIONS,HEAD

# TLS_CERT_FILE / TLS_KEY_FILE left blank: this deployment terminates TLS
# outside the pod, so minioth serves plain HTTP internally.
TLS_CERT_FILE=
TLS_KEY_FILE=

ISSUER=http://minioth:9090
JWT_SIGNING_ALG=HS256

HASH_COST=4

# Password policy
PASSWORD_MIN_LENGTH=8
PASSWORD_MAX_LENGTH=72
PASSWORD_REQUIRE_UPPER=false
PASSWORD_REQUIRE_LOWER=false
PASSWORD_REQUIRE_DIGIT=false
PASSWORD_REQUIRE_SPECIAL=false

# Per-client-IP rate limit on register/login/passwd(-reset)
RATE_LIMIT_RPS=2
RATE_LIMIT_BURST=10
