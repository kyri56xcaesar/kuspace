<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ .error }} · kuSpace</title>
  <link rel="icon" href="/api/v1/assets/logos/cropped.png">
  <!-- styles -->
  <link href="/api/v1/css/styles.css" rel="stylesheet">
  <link href="/api/v1/css/error.css" rel="stylesheet">
  <!-- scripts: every script this page uses is included here -->
  <script src="/api/v1/js/csrf.js"></script>
  <script src="/api/v1/js/theme-boot.js"></script>
</head>
<body>
  <main class="error">
    <img class="error-mark" src="/api/v1/assets/logos/cropped.png" alt="">
    <p class="error-code">Error {{ .error }}</p>
    <h1 class="error-message">{{ .message }}</h1>
    <p class="error-hint">The page you asked for is not here, or you cannot see it.</p>
    <a class="error-back" href="/api/v1/login">Back to kuSpace</a>
  </main>
</body>
</html>
