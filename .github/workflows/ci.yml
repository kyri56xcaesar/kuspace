# Unit tests, vet and lint on every push and pull request.
# The end-to-end smoke test (make up && make smoke) needs the compose stack
# and runs locally; see BACKLOG.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # interpreters for the editor starters' tests (python, perl, gcc and
      # go are on the runner already; R is skipped)
      - name: language interpreters
        run: sudo apt-get update -q && sudo apt-get install -yq ruby php-cli default-jdk-headless
      - name: gofmt, go vet, unit tests with the race detector, browser JS tests
        run: make ci
      - name: fuzz every target briefly (seeds also run as unit tests)
        run: make fuzz FUZZTIME=10s
      - name: minioth unit tests (pinned submodule)
        run: cd third_party/minioth && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the code is at zero findings: any finding fails the build
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          args: -c .golangci-lint.yaml
